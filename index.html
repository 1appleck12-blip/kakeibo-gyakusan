<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="逆算家計簿">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<title>逆算家計簿</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Mochiy+Pop+One&display=swap');

  :root{
    --bg: #0b0b0c;
    --panel: #17171a;
    --panel-2: #1d1d21;
    --line: #2c2c31;
    --ink: #ece7de;
    --ink-dim: #9a968d;
    --vermilion: #c8452e;
    --vermilion-dim: #7a3025;
    --gold: #b89257;
    --green: #6f9c76;
    --danger: #8a3b34;
    --c1:#c8452e; --c2:#4f7d63; --c3:#b89257; --c4:#4a6fa5; --c5:#7d6ba0; --c6:#a85c5c; --c7:#4f8a8b; --c8:#8a7248; --c9:#5c7a99; --c10:#9c5b8c;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    overscroll-behavior:none;
  }
  body{ padding-bottom:48px; }

  .wrap{ max-width:560px; margin:0 auto; padding:28px 20px 20px; }

  header.top{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:22px; gap:6px;
  }
  header.top h1{
    font-family:'Mochiy Pop One', 'Zen Kaku Gothic New', sans-serif;
    font-weight:400; font-size:32px; letter-spacing:.06em; margin:0; text-align:center;
    color:#f7d94a;
    -webkit-text-stroke: 1.6px #2f5fb3;
    text-stroke: 1.6px #2f5fb3;
    text-shadow:
      -1.6px -1.6px 0 #2f5fb3,
       1.6px -1.6px 0 #2f5fb3,
      -1.6px  1.6px 0 #2f5fb3,
       1.6px  1.6px 0 #2f5fb3,
       0 3px 0 #1c3d78;
  }
  header.top .en{
    font-size:10px; letter-spacing:.18em; color:var(--ink-dim); font-family:'Zen Kaku Gothic New', sans-serif;
    text-align:center;
  }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:18px 18px 20px; margin-bottom:16px;
  }

  .field-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:10px; border-bottom:1px solid var(--gold); margin-bottom:4px;
  }
  .field-row .lbl{ font-size:14px; color:var(--ink-dim); letter-spacing:.05em; }
  .field-row input[type=number]{
    background:transparent; border:none; color:var(--ink); font-size:22px; font-weight:700;
    text-align:right; width:150px; font-family:'Zen Kaku Gothic New', sans-serif;
  }
  .field-row input[type=number]:focus{ outline:none; color:#fff; }
  .yen{ font-size:16px; color:var(--ink-dim); margin-right:2px; }

  .section-title{
    font-size:13px; color:var(--ink-dim); letter-spacing:.1em; margin:2px 0 14px;
  }

  .cat-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px dashed var(--line);
  }
  .cat-row .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .cat-row .name{ flex:1; font-size:15px; }
  .cat-row .budget-input{
    background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--ink); font-size:14px; text-align:right; width:80px; padding:2px 0;
  }
  .cat-row .budget-input:focus{ outline:none; border-color:var(--gold); }
  .cat-row .spent{ font-size:13px; color:var(--ink-dim); width:64px; text-align:right; }
  .cat-row .del{
    background:none; border:none; color:var(--vermilion-dim); font-size:16px; cursor:pointer; padding:2px 4px;
  }
  .cat-row .del:active{ color:var(--vermilion); }
  .cat-row .move-btns{ display:flex; flex-direction:column; gap:2px; margin-right:2px; }
  .cat-row .move-btns button{
    background:none; border:none; color:var(--ink-dim); font-size:11px; cursor:pointer;
    line-height:1; padding:2px 4px;
  }
  .cat-row .move-btns button:active{ color:var(--gold); }
  .cat-row .move-btns button:disabled{ color:#3a3a40; cursor:default; }

  .add-cat{ display:flex; gap:8px; margin-top:14px; }
  .add-cat input[type=text]{
    flex:1; background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--ink); font-size:14px; padding:6px 2px;
  }
  .add-cat input[type=number]{
    width:80px; background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--ink); font-size:14px; padding:6px 2px; text-align:right;
  }
  .add-cat input:focus{ outline:none; border-color:var(--gold); }
  .add-cat input.err{ border-color:var(--vermilion); animation: shake .3s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }
  .add-cat button{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    font-size:13px; padding:0 14px; border-radius:4px; cursor:pointer;
  }
  .add-cat button:active{ background:var(--vermilion-dim); border-color:var(--vermilion); }

  .budget-total{
    display:flex; justify-content:space-between; margin-top:14px; padding-top:12px;
    border-top:1px solid var(--line); font-size:14px; color:var(--ink-dim);
  }
  .budget-total b{ color:var(--ink); font-size:16px; }

  /* donut */
  .donut-wrap{ display:flex; align-items:center; gap:22px; }
  .donut{
    width:150px; height:150px; border-radius:50%; position:relative; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: conic-gradient(var(--panel-2) 0deg 360deg);
  }
  .donut::after{
    content:''; position:absolute; width:98px; height:98px; border-radius:50%; background:var(--panel);
  }
  .donut .center{ position:relative; z-index:1; text-align:center; }
  .donut .center .amt{ font-size:19px; font-weight:700; }
  .donut .center .lbl{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
  .legend{ flex:1; font-size:13px; color:var(--ink-dim); }
  .legend .empty{ color:var(--ink-dim); }
  .legend-item{ display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .legend-item .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .legend-item .nm{ flex:1; color:var(--ink); }
  .legend-item .val{ color:var(--ink-dim); }

  /* record entry */
  .input-line{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--ink); font-size:15px; padding:8px 2px; margin-bottom:16px;
  }
  .input-line::placeholder{ color:#5c584f; }
  .input-line:focus{ outline:none; border-color:var(--gold); }

  .cat-amount-row{ display:flex; gap:12px; margin-bottom:16px; }
  select.cat-select{
    flex:1.3; background:var(--panel-2); border:1px solid var(--line); border-radius:4px;
    color:var(--ink); font-size:15px; padding:9px 8px;
  }
  input.amt-input{
    flex:1; background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--ink); font-size:16px; text-align:right; padding:8px 2px;
  }
  input.amt-input:focus, select.cat-select:focus{ outline:none; }
  input.err{ border-color:var(--vermilion) !important; animation: shake .3s; }

  input.date-input{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--ink); font-size:15px; padding:8px 2px; margin-bottom:18px;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  input.date-input:focus{ outline:none; border-color:var(--gold); }
  input.date-input::-webkit-calendar-picker-indicator{ filter:invert(0.7); }

  .btn-primary{
    width:100%; background:var(--vermilion); border:none; border-radius:5px;
    color:#fff; font-size:16px; font-weight:700; padding:14px; cursor:pointer;
    letter-spacing:.05em;
  }
  .btn-primary:active{ background:#a8371f; }

  .record-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 0; border-bottom:1px dashed var(--line); font-size:14px;
  }
  .record-item .rl{ display:flex; flex-direction:column; gap:2px; }
  .record-item .rl .memo{ color:var(--ink); }
  .record-item .rl .meta{ font-size:11px; color:var(--ink-dim); }
  .record-item .rr{ display:flex; align-items:center; gap:10px; }
  .record-item .amt{ color:var(--ink); font-weight:600; }
  .record-item .del{ background:none; border:none; color:var(--vermilion-dim); font-size:15px; cursor:pointer; }
  .empty-note{ text-align:center; color:var(--ink-dim); padding:22px 0; font-size:14px; }

  /* remaining box */
  .remain-wrap{ position:relative; margin-top:6px; }
  .stamp{
    position:absolute; top:-14px; left:-8px; z-index:2;
    background:var(--vermilion); color:#fff; font-family:'Shippori Mincho', serif;
    font-size:13px; padding:6px 10px; border-radius:3px; transform:rotate(-6deg);
    box-shadow:0 3px 8px rgba(0,0,0,.5); letter-spacing:.15em;
  }
  .remain-box{
    border:1px solid var(--gold); border-radius:6px; padding:22px 20px 18px;
    background:var(--panel); display:flex; justify-content:space-between; align-items:flex-end;
  }
  .remain-box .lbl{ color:var(--ink-dim); font-size:14px; letter-spacing:.05em; }
  .remain-box .amt{ font-size:34px; font-weight:800; color:var(--green); font-family:'Shippori Mincho', serif; }
  .remain-box .amt.neg{ color:var(--vermilion); }

  .sub-summary{
    display:flex; justify-content:space-between; font-size:13px; color:var(--ink-dim);
    margin-top:14px; padding:0 2px;
  }

  .reset-btn{
    display:block; margin:22px auto 0; background:none; border:1px solid var(--line);
    color:var(--ink-dim); font-size:13px; padding:9px 22px; border-radius:5px; cursor:pointer;
  }
  .reset-btn:active{ border-color:var(--vermilion-dim); color:var(--vermilion); }

  .confirm-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.7); display:none;
    align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .confirm-overlay.show{ display:flex; }
  .confirm-box{
    background:var(--panel-2); border:1px solid var(--gold); border-radius:8px;
    padding:24px 20px; max-width:320px; text-align:center;
  }
  .confirm-box p{ font-size:14px; color:var(--ink); margin:0 0 18px; line-height:1.6; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions button{
    flex:1; padding:11px; border-radius:5px; font-size:14px; cursor:pointer; border:1px solid var(--line);
    background:var(--panel); color:var(--ink);
  }
  .confirm-actions button.ok{ background:var(--vermilion); border-color:var(--vermilion); color:#fff; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>逆算家計簿</h1>
    <span class="en">GYAKUSAN LEDGER</span>
  </header>

  <div class="card">
    <div class="field-row">
      <span class="lbl">予算総額</span>
      <div><span class="yen">¥</span><input type="number" id="totalBudget" value="0" inputmode="numeric"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">カテゴリ別の予算</div>
    <div id="catList"></div>
    <div class="add-cat">
      <input type="text" id="newCatName" placeholder="新しいカテゴリ名">
      <input type="number" id="newCatBudget" placeholder="¥予算" inputmode="numeric">
      <button onclick="addCategory()">追加</button>
    </div>
    <div class="budget-total">
      <span>予算の合計</span>
      <b id="budgetSum">¥0</b>
    </div>
  </div>

  <div class="card">
    <div class="section-title">内訳</div>
    <div class="donut-wrap">
      <div class="donut" id="donut">
        <div class="center">
          <div class="amt" id="donutTotal">¥0</div>
          <div class="lbl">合計</div>
        </div>
      </div>
      <div class="legend" id="legend"><div class="empty">記録がまだありません</div></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">使った金額を記録する</div>
    <input type="text" class="input-line" id="memoInput" placeholder="なにに使った？（任意）">
    <div class="cat-amount-row">
      <select class="cat-select" id="catSelect"></select>
      <input type="number" class="amt-input" id="amtInput" placeholder="¥0" inputmode="numeric">
    </div>
    <input type="date" class="date-input" id="dateInput">
    <button class="btn-primary" onclick="addRecord()">＋ 記録に追加</button>
  </div>

  <div class="card">
    <div class="section-title">これまでの記録</div>
    <div id="recordList"><div class="empty-note">まだ記録はありません</div></div>
  </div>

  <div class="remain-wrap">
    <div class="stamp">のこり</div>
    <div class="remain-box">
      <span class="lbl">残金</span>
      <span class="amt" id="remainAmt">¥0</span>
    </div>
  </div>

  <div class="sub-summary">
    <span>使った合計 <span id="spentSum">¥0</span></span>
    <span id="recordCount">0 件</span>
  </div>

  <button class="reset-btn" onclick="openConfirm('記録・予算・カテゴリをすべて消去します。<br>この操作は元に戻せません。<br>よろしいですか？', doReset, 'リセットする')">記録をすべてリセット</button>

</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg">本当によろしいですか？</p>
    <div class="confirm-actions">
      <button onclick="closeConfirm()">やめる</button>
      <button class="ok" id="confirmOkBtn">削除する</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'gyakusan-ledger-v1';
const DEFAULT_COLORS = ['#c8452e','#4f7d63','#b89257','#4a6fa5','#7d6ba0','#a85c5c','#4f8a8b','#8a7248','#5c7a99','#9c5b8c'];
const DEFAULT_CATS = ['食費','日用品','趣味','固定費','その他','医療費','交通費','衣服','交際費','投資'];

let state = { totalBudget:0, categories:[], records:[] };

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      if(typeof state.nextColorIndex !== 'number'){
        state.nextColorIndex = state.categories.length % DEFAULT_COLORS.length;
      }
      return;
    }
  }catch(e){}
  state = {
    totalBudget: 0,
    categories: DEFAULT_CATS.map((n,i)=>({ id: 'c'+i, name:n, budget:0, color: DEFAULT_COLORS[i % DEFAULT_COLORS.length] })),
    records: [],
    nextColorIndex: DEFAULT_CATS.length % DEFAULT_COLORS.length
  };
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function fmt(n){ return '¥' + Math.round(n).toLocaleString('ja-JP'); }

function spentByCategory(catId){
  return state.records.filter(r=>r.catId===catId).reduce((s,r)=>s+Number(r.amount||0),0);
}
function totalSpent(){
  return state.records.reduce((s,r)=>s+Number(r.amount||0),0);
}
function totalCatBudget(){
  return state.categories.reduce((s,c)=>s+Number(c.budget||0),0);
}

function render(){
  document.getElementById('totalBudget').value = state.totalBudget;

  // categories
  const catList = document.getElementById('catList');
  catList.innerHTML = '';
  state.categories.forEach((c,idx)=>{
    const spent = spentByCategory(c.id);
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = `
      <div class="move-btns">
        <button class="move-up" data-id="${c.id}" ${idx===0?'disabled':''}>▲</button>
        <button class="move-down" data-id="${c.id}" ${idx===state.categories.length-1?'disabled':''}>▼</button>
      </div>
      <span class="dot" style="background:${c.color}"></span>
      <span class="name">${escapeHtml(c.name)}</span>
      <input type="number" class="budget-input" value="${c.budget}" inputmode="numeric" data-id="${c.id}">
      <span class="spent">${fmt(spent)}</span>
      <button class="del" data-id="${c.id}">×</button>
    `;
    catList.appendChild(row);
  });
  catList.querySelectorAll('.move-up').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      const i = state.categories.findIndex(c=>c.id===id);
      if(i>0){
        [state.categories[i-1], state.categories[i]] = [state.categories[i], state.categories[i-1]];
        saveState(); render();
      }
    });
  });
  catList.querySelectorAll('.move-down').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      const i = state.categories.findIndex(c=>c.id===id);
      if(i>-1 && i<state.categories.length-1){
        [state.categories[i], state.categories[i+1]] = [state.categories[i+1], state.categories[i]];
        saveState(); render();
      }
    });
  });
  catList.querySelectorAll('.budget-input').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const c = state.categories.find(c=>c.id===e.target.dataset.id);
      if(c){ c.budget = Number(e.target.value)||0; saveState(); render(); }
    });
  });
  catList.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      const cat = state.categories.find(c=>c.id===id);
      const name = cat ? cat.name : 'このカテゴリ';
      const hasRecords = state.records.some(r=>r.catId===id);
      const msg = hasRecords
        ? `「${name}」を削除します。<br>このカテゴリの記録もすべて消えます。<br>よろしいですか？`
        : `「${name}」を削除します。<br>よろしいですか？`;
      openConfirm(msg, ()=>{
        state.categories = state.categories.filter(c=>c.id!==id);
        state.records = state.records.filter(r=>r.catId!==id);
        saveState(); render();
      });
    });
  });

  document.getElementById('budgetSum').textContent = fmt(totalCatBudget());

  // category select for record entry
  const sel = document.getElementById('catSelect');
  const prevVal = sel.value;
  sel.innerHTML = state.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  if(state.categories.some(c=>c.id===prevVal)) sel.value = prevVal;

  // donut + legend
  const spent = totalSpent();
  document.getElementById('donutTotal').textContent = fmt(spent);
  const donut = document.getElementById('donut');
  const legend = document.getElementById('legend');
  if(spent <= 0){
    donut.style.background = 'conic-gradient(var(--panel-2) 0deg 360deg)';
    legend.innerHTML = '<div class="empty">記録がまだありません</div>';
  }else{
    let acc = 0;
    const stops = [];
    const items = [];
    state.categories.forEach(c=>{
      const s = spentByCategory(c.id);
      if(s<=0) return;
      const deg = (s/spent)*360;
      stops.push(`${c.color} ${acc}deg ${acc+deg}deg`);
      items.push({name:c.name, color:c.color, val:s});
      acc += deg;
    });
    if(stops.length===0){
      donut.style.background = 'conic-gradient(var(--panel-2) 0deg 360deg)';
      legend.innerHTML = '<div class="empty">記録がまだありません</div>';
    }else{
      donut.style.background = `conic-gradient(${stops.join(',')})`;
      legend.innerHTML = items.sort((a,b)=>b.val-a.val).map(it=>`
        <div class="legend-item">
          <span class="dot" style="background:${it.color}"></span>
          <span class="nm">${escapeHtml(it.name)}</span>
          <span class="val">${fmt(it.val)}</span>
        </div>
      `).join('');
    }
  }

  // records
  const recordList = document.getElementById('recordList');
  if(state.records.length===0){
    recordList.innerHTML = '<div class="empty-note">まだ記録はありません</div>';
  }else{
    const sorted = [...state.records].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt);
    recordList.innerHTML = sorted.map(r=>{
      const cat = state.categories.find(c=>c.id===r.catId);
      const catName = cat ? cat.name : '（削除済み）';
      const memo = r.memo ? escapeHtml(r.memo) : catName;
      return `
        <div class="record-item">
          <div class="rl">
            <span class="memo">${memo}</span>
            <span class="meta">${catName} ・ ${r.date||''}</span>
          </div>
          <div class="rr">
            <span class="amt">${fmt(r.amount)}</span>
            <button class="del" data-id="${r.id}">×</button>
          </div>
        </div>
      `;
    }).join('');
    recordList.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', e=>{
        const id = e.target.dataset.id;
        state.records = state.records.filter(r=>r.id!==id);
        saveState(); render();
      });
    });
  }

  // remaining / summary
  const remain = state.totalBudget - spent;
  const remainEl = document.getElementById('remainAmt');
  remainEl.textContent = fmt(remain);
  remainEl.classList.toggle('neg', remain < 0);
  document.getElementById('spentSum').textContent = fmt(spent);
  document.getElementById('recordCount').textContent = state.records.length + ' 件';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

document.getElementById('totalBudget').addEventListener('change', e=>{
  state.totalBudget = Number(e.target.value)||0;
  saveState(); render();
});

function addCategory(){
  const nameInp = document.getElementById('newCatName');
  const budgetInp = document.getElementById('newCatBudget');
  const name = nameInp.value.trim();
  if(!name){
    nameInp.classList.remove('err'); void nameInp.offsetWidth; nameInp.classList.add('err');
    nameInp.placeholder = 'カテゴリ名を入力してください';
    nameInp.focus();
    setTimeout(()=>{ nameInp.classList.remove('err'); nameInp.placeholder = '新しいカテゴリ名'; }, 1600);
    return;
  }
  const budget = Number(budgetInp.value)||0;
  if(typeof state.nextColorIndex !== 'number') state.nextColorIndex = 0;
  const color = DEFAULT_COLORS[state.nextColorIndex % DEFAULT_COLORS.length];
  state.nextColorIndex = (state.nextColorIndex + 1) % DEFAULT_COLORS.length;
  state.categories.push({ id:'c'+Date.now(), name, budget, color });
  nameInp.value=''; budgetInp.value='';
  saveState(); render();
}

function addRecord(){
  const memo = document.getElementById('memoInput').value.trim();
  const catId = document.getElementById('catSelect').value;
  const amtInp = document.getElementById('amtInput');
  const amount = Number(amtInp.value)||0;
  const date = document.getElementById('dateInput').value || todayStr();
  if(!catId || amount<=0){
    amtInp.classList.remove('err'); void amtInp.offsetWidth; amtInp.classList.add('err');
    const orig = amtInp.placeholder;
    amtInp.placeholder = '金額を入力してください';
    amtInp.focus();
    setTimeout(()=>{ amtInp.classList.remove('err'); amtInp.placeholder = orig; }, 1600);
    return;
  }
  state.records.push({ id:'r'+Date.now(), memo, catId, amount, date, createdAt:Date.now() });
  document.getElementById('memoInput').value='';
  document.getElementById('amtInput').value='';
  saveState(); render();
}

function todayStr(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

let _confirmAction = null;
function openConfirm(message, onConfirm, okLabel){
  document.getElementById('confirmMsg').innerHTML = message;
  const okBtn = document.getElementById('confirmOkBtn');
  okBtn.textContent = okLabel || '削除する';
  _confirmAction = onConfirm;
  okBtn.onclick = ()=>{ if(_confirmAction) _confirmAction(); closeConfirm(); };
  document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm(){
  document.getElementById('confirmOverlay').classList.remove('show');
  _confirmAction = null;
}
function doReset(){
  state = {
    totalBudget: 0,
    categories: DEFAULT_CATS.map((n,i)=>({ id: 'c'+i, name:n, budget:0, color: DEFAULT_COLORS[i % DEFAULT_COLORS.length] })),
    records: [],
    nextColorIndex: DEFAULT_CATS.length % DEFAULT_COLORS.length
  };
  saveState(); render();
}

document.getElementById('dateInput').value = todayStr();
loadState();
render();
</script>
</body>
</html>
